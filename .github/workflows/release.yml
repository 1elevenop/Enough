name: Release

# Push a tag like v1.0.0 to build a signed APK and open a DRAFT GitHub release.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the release .jks
#   ANDROID_STORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS        key alias (e.g. enough)
#   ANDROID_KEY_PASSWORD     key password
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Check tag matches pubspec version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $have"; exit 1
          fi

      - name: Set up signing (refuses to ship a debug-signed APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Secrets pasted on Windows often carry a trailing CR/LF; strip it.
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret for $v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # key.properties is a Java properties file: backslashes must be escaped.
          bs='\'
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${STORE_PASSWORD//"$bs"/"$bs$bs"}"
            echo "keyAlias=${KEY_ALIAS//"$bs"/"$bs$bs"}"
            echo "keyPassword=${KEY_PASSWORD//"$bs"/"$bs$bs"}"
          } > android/key.properties
          # Every value must have survived (a broken escape once produced empty ones).
          for k in storePassword keyAlias keyPassword; do
            grep -q "^$k=." android/key.properties || { echo "::error::key.properties has an empty $k"; exit 1; }
          done
          # Fail fast with a clear message instead of deep inside Gradle.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::ANDROID_STORE_PASSWORD or ANDROID_KEY_ALIAS does not match the keystore"; exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify signature is not the debug key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi

      - name: Package
        run: |
          apk="enough-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          tar -czf "symbols-${GITHUB_REF_NAME}.tar.gz" -C build symbols

      # Obfuscation symbols stay private (workflow artifact), for decoding crash traces.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.ref_name }}
          path: symbols-${{ github.ref_name }}.tar.gz
          retention-days: 90

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Section body between "## [X.Y.Z]" and the next "## " heading (plain string match, no regex).
          notes="$(awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --draft --title "Enough $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}" \
            "enough-${GITHUB_REF_NAME}.apk" "enough-${GITHUB_REF_NAME}.apk.sha256"
